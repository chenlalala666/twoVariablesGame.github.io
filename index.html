<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>二十四节气APP原型</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
    }
    
    body {
      background-color: #f5f5f5;
      padding: 30px;
    }
    
    h1 {
      text-align: center;
      margin-bottom: 20px;
      color: #333;
    }
    
    .description {
      max-width: 800px;
      margin: 0 auto 30px;
      text-align: center;
      color: #666;
      line-height: 1.6;
    }
    
    .screens-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 30px;
    }
    
    .device-container {
      display: inline-block;
      vertical-align: top;
    }
    
    .screen-title {
      text-align: center;
      margin: 10px 0;
      font-size: 16px;
      color: #333;
      font-weight: 500;
    }

    iframe {
      border: none;
      width: 390px;
      height: 844px;
      background-color: white;
      border-radius: 40px;
      overflow: hidden;
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.15);
    }
  </style>
</head>
<body>
  <h1>二十四节气APP原型</h1>
  <div class="description">
    <p>基于二十四节气的高保真APP原型，包含首页、节气列表、节气详情、养生和个人中心等界面。</p>
    <p>设计遵循iOS设计规范，界面美观实用，可直接用于开发参考。</p>
    <p style="margin-top: 10px; font-weight: 500;">交互功能：可点击底部导航栏切换页面、点击列表项查看详情、搜索功能支持回车键、点击季节标签可过滤内容、折叠/展开季节卡片等。</p>
  </div>
  
  <div class="screens-container">
    <div class="device-container">
      <div class="screen-title">首页</div>
      <iframe src="screens/home.html" title="首页"></iframe>
    </div>
    
    <div class="device-container">
      <div class="screen-title">节气列表</div>
      <iframe src="screens/jieqi_list.html" title="节气列表"></iframe>
    </div>
    
    <div class="device-container">
      <div class="screen-title">节气详情</div>
      <iframe src="screens/jieqi_detail.html" title="节气详情"></iframe>
    </div>
    
    <div class="device-container">
      <div class="screen-title">养生</div>
      <iframe src="screens/yangsheng.html" title="养生"></iframe>
    </div>
    
    <div class="device-container">
      <div class="screen-title">个人中心</div>
      <iframe src="screens/profile.html" title="个人中心"></iframe>
    </div>
  </div>
</body>
</html>
