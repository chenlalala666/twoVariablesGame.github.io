<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人中心 - 二十四节气</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="../js/main.js" defer></script>
</head>
<body>
  <div class="device">
    <!-- 状态栏 -->
    <div class="status-bar">
      <div class="time">09:29</div>
      <div class="right">
        <i class="fas fa-signal"></i>
        <i class="fas fa-wifi"></i>
        <i class="fas fa-battery-full"></i>
      </div>
    </div>

    <!-- 内容区域 -->
    <div class="content">
      <!-- 用户信息头部 -->
      <div style="background-color: var(--primary-color); padding: 30px 20px; color: white;">
        <div style="display: flex; align-items: center;">
          <div style="width: 70px; height: 70px; border-radius: 35px; background-color: #fff; overflow: hidden; margin-right: 15px;">
            <img src="https://images.unsplash.com/photo-1599566150163-29194dcaad36?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=774&q=80" alt="用户头像" style="width: 100%; height: 100%; object-fit: cover;">
          </div>
          <div>
            <div style="font-size: 18px; font-weight: 500; margin-bottom: 5px;">文化爱好者</div>
            <div style="font-size: 14px; opacity: 0.8;">二十四节气守护者</div>
          </div>
        </div>
        <div style="display: flex; justify-content: space-around; margin-top: 20px;">
          <div style="text-align: center;">
            <div style="font-size: 20px; font-weight: 600;">28</div>
            <div style="font-size: 12px; opacity: 0.8;">收藏</div>
          </div>
          <div style="text-align: center;">
            <div style="font-size: 20px; font-weight: 600;">15</div>
            <div style="font-size: 12px; opacity: 0.8;">笔记</div>
          </div>
          <div style="text-align: center;">
            <div style="font-size: 20px; font-weight: 600;">6</div>
            <div style="font-size: 12px; opacity: 0.8;">节气提醒</div>
          </div>
        </div>
      </div>

      <!-- 功能区 -->
      <div class="card" style="margin-top: 20px;">
        <div class="list-item">
          <div class="list-item-icon" style="background-color: var(--primary-light); color: white;">
            <i class="fas fa-bell"></i>
          </div>
          <div class="list-item-content">
            <div class="list-item-title">节气提醒</div>
            <div class="list-item-subtitle">设置节气到来前的提醒</div>
          </div>
          <div style="color: #aaa;">
            <i class="fas fa-angle-right"></i>
          </div>
        </div>
        <div class="list-item">
          <div class="list-item-icon" style="background-color: var(--primary-light); color: white;">
            <i class="fas fa-bookmark"></i>
          </div>
          <div class="list-item-content">
            <div class="list-item-title">我的收藏</div>
            <div class="list-item-subtitle">查看收藏的节气和养生文章</div>
          </div>
          <div style="color: #aaa;">
            <i class="fas fa-angle-right"></i>
          </div>
        </div>
        <div class="list-item">
          <div class="list-item-icon" style="background-color: var(--primary-light); color: white;">
            <i class="fas fa-edit"></i>
          </div>
          <div class="list-item-content">
            <div class="list-item-title">我的笔记</div>
            <div class="list-item-subtitle">查看和编辑个人笔记</div>
          </div>
          <div style="color: #aaa;">
            <i class="fas fa-angle-right"></i>
          </div>
        </div>
      </div>

      <!-- 设置区 -->
      <div class="card" style="margin-top: 15px;">
        <div class="list-item">
          <div class="list-item-icon" style="background-color: #e0e0e0; color: #666;">
            <i class="fas fa-globe"></i>
          </div>
          <div class="list-item-content">
            <div class="list-item-title">地区设置</div>
            <div class="list-item-subtitle">当前：北京</div>
          </div>
          <div style="color: #aaa;">
            <i class="fas fa-angle-right"></i>
          </div>
        </div>
        <div class="list-item">
          <div class="list-item-icon" style="background-color: #e0e0e0; color: #666;">
            <i class="fas fa-calendar-alt"></i>
          </div>
          <div class="list-item-content">
            <div class="list-item-title">日历设置</div>
            <div class="list-item-subtitle">设置显示农历/公历</div>
          </div>
          <div style="color: #aaa;">
            <i class="fas fa-angle-right"></i>
          </div>
        </div>
        <div class="list-item">
          <div class="list-item-icon" style="background-color: #e0e0e0; color: #666;">
            <i class="fas fa-palette"></i>
          </div>
          <div class="list-item-content">
            <div class="list-item-title">主题设置</div>
            <div class="list-item-subtitle">自定义应用主题颜色</div>
          </div>
          <div style="color: #aaa;">
            <i class="fas fa-angle-right"></i>
          </div>
        </div>
        <div class="list-item">
          <div class="list-item-icon" style="background-color: #e0e0e0; color: #666;">
            <i class="fas fa-cog"></i>
          </div>
          <div class="list-item-content">
            <div class="list-item-title">通用设置</div>
            <div class="list-item-subtitle">清除缓存、关于我们</div>
          </div>
          <div style="color: #aaa;">
            <i class="fas fa-angle-right"></i>
          </div>
        </div>
      </div>

      <!-- 意见反馈 -->
      <div class="card" style="margin: 15px 15px 30px 15px;">
        <div class="list-item">
          <div class="list-item-icon" style="background-color: #e0e0e0; color: #666;">
            <i class="fas fa-comment-alt"></i>
          </div>
          <div class="list-item-content">
            <div class="list-item-title">意见反馈</div>
            <div class="list-item-subtitle">帮助我们改进应用</div>
          </div>
          <div style="color: #aaa;">
            <i class="fas fa-angle-right"></i>
          </div>
        </div>
      </div>

      <!-- 底部版本信息 -->
      <div style="text-align: center; color: #999; font-size: 12px; padding: 15px; margin-bottom: 20px;">
        二十四节气 V1.0.0 © 2025
      </div>
    </div>

    <!-- 底部导航栏 -->
    <div class="tab-bar">
      <div class="tab-item">
        <i class="fas fa-home"></i>
        <span>首页</span>
      </div>
      <div class="tab-item">
        <i class="fas fa-calendar-alt"></i>
        <span>节气</span>
      </div>
      <div class="tab-item">
        <i class="fas fa-book-open"></i>
        <span>养生</span>
      </div>
      <div class="tab-item active">
        <i class="fas fa-user"></i>
        <span>我的</span>
      </div>
    </div>
  </div>
</body>
</html>
